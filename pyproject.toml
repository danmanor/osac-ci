[project]
name = "osac-ci"
version = "0.1.0"
description = "Policy-driven CI control plane: explains and decides the CI state of a pull request"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
osac-ci = "osac_ci.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.14",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "syrupy>=4.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/osac_ci"]

# The rules file lives in policy/ so a reviewer finds it; the wheel carries a copy next to the code (see flow.py).
[tool.hatch.build.targets.wheel.force-include]
"policy/flow.yml" = "osac_ci/flow.yml"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/contract"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests, no I/O",
    "property: hypothesis property tests",
    "legacy: differential tests against the real legacy scripts (need bash, jq and the sibling repos)",
    "contract: adapter contract tests against recorded GitHub responses",
    "replay: replay against real PR history (needs a token, nightly)",
    "sandbox: end-to-end tests against a real GitHub sandbox repo",
    "security: injection, permission and tamper tests",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
