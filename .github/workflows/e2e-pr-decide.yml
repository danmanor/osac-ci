---
# Shared workflow: decides, for a pull request, whether the full-install E2E may start, keeps the pull request's one `E2E`
# check up to date, and does the housekeeping around it. A repository calls it from its own `e2e-pr.yml` (see
# docs/CALLERS.md for the short caller). The rules it applies are in policy/flow.yml and in the repository's own
# `.github/e2e-policy.yml` (which suites a change needs); the rules are read from this repository at the commit the
# caller pinned, never from the pull request.
#
# The E2E takes about 100 minutes of a real cluster, so it starts only when:
#   * a person with write access, or CodeRabbit, has approved the exact head commit (a push drops the approval; a clean
#     rebase keeps it). For a pull request from a fork only a person with write access counts: the author of a fork
#     controls what CodeRabbit reads, and the E2E runs that code with secrets,
#   * no cheap check has already failed on that commit, and
#   * the change touches something an E2E suite tests (docs and the like need none).
# It does NOT wait for CI: the E2E runs in parallel with it, and both are required for the merge.
#
# Jobs (all in the default branch's context, so none of them puts a row on the pull request):
#   decide              the decision and the `E2E` check (waiting with the reason / not affected / start);
#   auto-merge          turns on auto-merge for an approved pull request (with the app token: a pull request queued with
#                       the workflow's own token starts no workflow for the queue);
#   clean-relay         deletes the finished review relay run and early comment run, whose rows would stay on the pull
#                       request;
#   tidy-jira-reference deletes the older runs of the Jira reference check of the commit, keeping the newest.
#
# Suites by hand: besides the automatic start, the decide job keeps one comment on the pull request (written by the OSAC CI
# app, for a pull request of a member of the organization) that lists the E2E suites with a checkbox each. A member of the
# organization who checks a box starts that suite for the head commit, whatever the approval state (a draft, a fork and
# the member's own pull request included). A comment of one line does the same: `/test` (the suites the change needs) or
# `/test vmaas caas` (those suites). The box clears itself, and the comment says what became of the request. A
# suite that is running or has passed on the commit is not started again. A run started by hand never claims the `E2E`
# check: it writes the suite lines, and the `E2E` check turns green only when every suite the change needs has passed.
#
# What the caller must do (the contract):
#   * trigger on `workflow_run` of its CI workflow, its review relay and its early comment workflow (e2e-pr-comment.yml;
#     types requested, completed), on
#     `workflow_dispatch` with a `number` input, and on `issue_comment` (types edited, for the boxes of the comment, and
#     created, for a `/test` comment);
#   * set `run-name` to `E2E <head repository>:<head branch> @ <head sha>` for a `workflow_run` (the cancel step reads run
#     titles, because a run of a workflow_run belongs to the default branch, not to the pull request commit);
#   * give the calling job at least these permissions: contents read, pull-requests read, checks read, actions write;
#   * pass the secret OSAC_CI_APP_PRIVATE_KEY explicitly (never `secrets: inherit`).
name: E2E pull request decision

on:  # zizmor: ignore[dangerous-triggers] -- shared workflow, called from a workflow_run caller; no pull request code runs
  workflow_call:
    inputs:
      policy-file:
        description: The repository's E2E policy (suites and path filters), read from its default branch
        type: string
        default: .github/e2e-policy.yml
      filters-file:
        description: The repository's shared path filters, read from its default branch (the policy points at it)
        type: string
        default: .github/filters/ci-filters.yml
      ci-workflow-name:
        description: Name of the repository's CI workflow (its completion is what wakes the tidy job)
        type: string
        default: CI
      relay-workflow-name:
        description: Name of the repository's review relay workflow
        type: string
        default: E2E review relay
      comment-workflow-name:
        description: Name of the repository's early comment workflow (e2e-pr-comment.yml); its finished run is deleted
        type: string
        default: E2E comment
      jira-workflow-path:
        description: Path of the repository's Jira reference workflow (its older runs are deleted)
        type: string
        default: .github/workflows/jira-reference.yml
      app-id:
        description: Id of the OSAC CI app
        type: string
        default: "4966101"
    secrets:
      OSAC_CI_APP_PRIVATE_KEY:
        description: Private key of the OSAC CI app (an organization secret)
        required: true
    outputs:
      start:
        description: '"true" when the E2E starts'
        value: ${{ jobs.decide.outputs.start }}
      sha:
        value: ${{ jobs.decide.outputs.sha }}
      number:
        value: ${{ jobs.decide.outputs.number }}
      suites:
        description: JSON list of the suite ids to run
        value: ${{ jobs.decide.outputs.suites }}
      suite-checks:
        value: ${{ jobs.decide.outputs.suite-checks }}
      head-repo:
        value: ${{ jobs.decide.outputs.head-repo }}
      fork-author:
        value: ${{ jobs.decide.outputs.fork-author }}
      fork-association:
        value: ${{ jobs.decide.outputs.fork-association }}
      manual:
        description: '"true" when the run was started by hand (a box of the control comment): the finish workflow then sums up'
        value: ${{ jobs.decide.outputs.manual }}
      selected-checks:
        description: JSON object, suite id -> line name, of every suite the change needs (for the finish workflow)
        value: ${{ jobs.decide.outputs.selected-checks }}

permissions: {}

jobs:
  # The E2E comment must be early in the conversation (a comment cannot be moved, and CodeRabbit and others post within
  # seconds of the pull request opening), but the decision needs about a minute to start, install its tools and read the
  # policy. So this job runs in parallel with it, starting when the CI run is requested, and posts a short placeholder the
  # moment it can; the decision then fills it in (`manual-comment` finds the comment by its marker and edits it, and if both
  # create one at the same time the oldest is kept). Nothing here reads the pull request's code: a member's pull request
  # only, an open one, once. This is the second chance: the caller's `E2E comment` workflow (e2e-pr-comment.yml) posts the
  # same placeholder when the pull request opens, a few seconds sooner, and then this job finds the comment there.
  comment-early:
    name: Post the E2E comment
    if: >-
      github.event_name == 'workflow_run' && github.event.action == 'requested' &&
      github.event.workflow_run.name == inputs.ci-workflow-name && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}  # the comment is written with the app token
    steps:
      - name: Token of the OSAC CI app, for the comment
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: write  # a comment on a pull request needs this one
          permission-members: read
      # `$/` is this workflow's own repository at the exact commit the caller pinned.
      - uses: $/.github/actions/early-comment
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          head-sha: ${{ github.event.workflow_run.head_sha }}

  decide:
    name: Decide
    # A finished run only matters when it belongs to a pull request (not to the merge queue or a push to main).
    # An edit of the control comment by a person (the app's own edits are skipped, or its clearing of a box would wake this
    # workflow again), or a new comment of a person that starts with /test (the program reads the exact command; a comment
    # that only starts like it, such as /testing, or an edit that unchecks a box, asks for nothing and is ignored: it never
    # reaches the automatic path, which would start every suite again once the E2E check has an answer).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_review' ||
      (github.event_name == 'issue_comment' && github.event.action == 'edited' && github.event.issue.pull_request &&
       github.event.sender.login != 'osac-ci[bot]' && github.event.comment.user.login == 'osac-ci[bot]' &&
       contains(github.event.comment.body, '<!-- osac-ci:manual-run -->')) ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && github.event.issue.pull_request &&
       github.event.comment.user.type == 'User' && startsWith(github.event.comment.body, '/test'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One decision at a time per head commit (or per pull request when started by hand), so two runs never claim the
    # same commit together. A checked box or a /test comment (issue_comment) is in its own group, by pull request number,
    # on purpose: in a shared group a burst of CI events could push out a request, and the person would see a checked box
    # that starts nothing. `queue: max` keeps every waiting run (up to 100) and runs them one after another; by default
    # GitHub keeps one waiting run per group and cancels the older one, so two people asking for different suites at once
    # would lose one of the requests. A burst of CI events costs a few extra decisions of about a minute, each of which
    # reads the state again. The two kinds of run cannot start the same suite twice in practice: the automatic start
    # happens once per commit, and a request skips a suite whose line is already waiting or running (the report writes the
    # lines before the suites start).
    concurrency:
      group: e2e-decide-${{ github.event.workflow_run.head_sha || github.event.inputs.number || github.event.issue.number }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read  # check out the policy and the path filters of the default branch, and osac-ci itself
      pull-requests: read  # the pull request, its reviews and files
      checks: read  # the check runs of the head commit, for the decision
      actions: write  # cancel the E2E of an older commit of the same pull request
    outputs:
      start: ${{ steps.report.outputs.start }}
      sha: ${{ steps.report.outputs.sha }}
      number: ${{ steps.report.outputs.number }}
      suites: ${{ steps.report.outputs.suites }}
      suite-checks: ${{ steps.report.outputs.suite-checks }}
      head-repo: ${{ steps.code.outputs.repo }}
      fork-author: ${{ steps.code.outputs.fork-author }}
      fork-association: ${{ steps.code.outputs.fork-association }}
      approved: ${{ steps.approved.outputs.yes }}
      approved-number: ${{ steps.approved.outputs.number }}
      approved-sha: ${{ steps.approved.outputs.sha }}
      manual: ${{ steps.by-hand.outputs.manual }}
      selected-checks: ${{ steps.by-hand.outputs.selected }}
    steps:
      # The repository that called this workflow, at its default branch (the ref a workflow_run runs at), never the pull
      # request: only its policy and path filters.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            ${{ inputs.policy-file }}
            ${{ inputs.filters-file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The E2E lines and the control comment are written by the OSAC CI app, and it reads who is a member of the
      # organization. The suite lines are check runs of the app, which the pull request page draws (a spinner while they
      # run, the exact names); a check run written with this workflow's own token would be attached to whichever Actions
      # check suite of the commit is oldest, and the page does not draw those. The token has the permissions this job
      # needs and lasts an hour.
      - name: Token of the OSAC CI app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-actions: read
          permission-issues: write
          permission-pull-requests: write  # a comment on a pull request needs this one, not only issues
          permission-members: read
      # `$/` is this workflow's own repository at the exact commit the caller pinned, so the actions used here are the ones
      # that were reviewed with this file (a plain `./` would resolve against the caller's workspace).
      - uses: $/.github/actions/e2e-decide
        id: decide
        with:
          github-token: ${{ github.token }}
          repo: ${{ github.repository }}
          policy-file: ${{ github.workspace }}/${{ inputs.policy-file }}
          number: ${{ github.event.inputs.number || github.event.issue.number }}
          head-sha: ${{ github.event.workflow_run.head_sha }}
          org-token: ${{ steps.app-token.outputs.token }}
          manual-comment-id: ${{ github.event_name == 'issue_comment' && github.event.comment.id || '' }}
          manual-by: ${{ github.event_name == 'issue_comment' && github.event.sender.login || '' }}
      - uses: $/.github/actions/e2e-report
        id: report
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          kind: checks
          repo: ${{ github.repository }}
          decision-file: ${{ steps.decide.outputs.json-file }}
      # A run started by hand, and the suites the change needs (the finish workflow sums them up).
      - name: Was it started by hand?
        id: by-hand
        if: steps.decide.outputs.number != ''
        env:
          DECISION: ${{ steps.decide.outputs.json-file }}
        run: |
          {
            echo "manual=$(jq -r '.[0].manual // false' "${DECISION}")"
            echo "selected=$(jq -c '.[0].selected_checks // {}' "${DECISION}")"
          } >> "$GITHUB_OUTPUT"
      # The control comment: created when the pull request has none, refreshed with what the suite lines say now, and the
      # answer to a request. A failure here must not hold up the E2E.
      - uses: $/.github/actions/manual-comment
        if: steps.decide.outputs.number != ''
        continue-on-error: true
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          org-token: ${{ steps.app-token.outputs.token }}
          repo: ${{ github.repository }}
          number: ${{ steps.decide.outputs.number }}
          policy-file: ${{ github.workspace }}/${{ inputs.policy-file }}
          decision-file: ${{ steps.decide.outputs.json-file }}
          by: ${{ github.event_name == 'issue_comment' && github.event.sender.login || '' }}
      # The answer on the command itself, so the person sees it where they wrote it: a rocket when suites start, a confused
      # face when none did (the control comment says why). A comment that only starts like the command gets nothing.
      - name: Answer the /test comment
        if: github.event_name == 'issue_comment' && github.event.action == 'created' && steps.decide.outputs.number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
          DECISION: ${{ steps.decide.outputs.json-file }}
        run: |
          set -euo pipefail
          if [ "$(jq -r '.[0].manual // false' "${DECISION}")" != "true" ]; then exit 0; fi
          reaction=confused
          if [ "$(jq -r '.[0].action' "${DECISION}")" = "start" ]; then reaction=rocket; fi
          gh api -X POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content="${reaction}" --silent
      # The pull request has an approval that counts on its head commit: the auto-merge job below turns auto-merge on.
      # Decided from the state, not from the event that woke this run: several runs for one commit replace each other, and
      # the one that survives may be any of them.
      - name: Is the pull request approved?
        id: approved
        if: steps.decide.outputs.number != ''
        env:
          DECISION: ${{ steps.decide.outputs.json-file }}
        run: |
          # One pull request was evaluated (the file is a list with one decision).
          {
            echo "yes=$(jq -r '.[0].approvers | length > 0' "${DECISION}")"
            echo "number=$(jq -r '.[0].number' "${DECISION}")"
            echo "sha=$(jq -r '.[0].head_sha' "${DECISION}")"
          } >> "$GITHUB_OUTPUT"
      # The repository the commit lives in (a fork for a fork pull request), for the suites to check out.
      - name: Find the code to test
        id: code
        if: steps.report.outputs.start == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.report.outputs.number }}
        run: |
          set -euo pipefail
          pull=$(gh api "repos/${REPO}/pulls/${NUMBER}")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<<"${pull}")
          if [[ -z "${head_repo}" ]]; then
            echo "::error::The repository of the pull request's branch no longer exists."
            exit 1
          fi
          echo "repo=${head_repo}" >> "$GITHUB_OUTPUT"
          # A commit from a fork must be authorized by the suite before it gets any secret (an org member, or the
          # ok-to-test label), whoever approved it. Both stay empty for a commit of this repository.
          if [[ "${head_repo}" != "${REPO}" ]]; then
            echo "fork-author=$(jq -r '.user.login' <<<"${pull}")" >> "$GITHUB_OUTPUT"
            echo "fork-association=$(jq -r '.author_association' <<<"${pull}")" >> "$GITHUB_OUTPUT"
          fi
      # The E2E of an older commit of this pull request is of no use any more, and it holds a runner. Only a decision
      # that found the pull request still at this commit gets here, so a late event for an old commit cancels nothing.
      # The caller's workflow file is found from `github.workflow_ref` (in a called workflow it names the caller).
      - name: Cancel the E2E of older commits
        if: steps.report.outputs.number != '' && steps.by-hand.outputs.manual != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.report.outputs.number }}
          DECISION: ${{ steps.decide.outputs.json-file }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          workflow_file=$(basename "${WORKFLOW_REF%%@*}")
          current=$(jq -r '.[0].head_sha' "${DECISION}")
          # The run title names the repository and branch of the event: the fork for a CI run, this repository for a
          # run started by a review. Match both, from the pull request itself.
          branch=$(gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.head.ref')
          head_repo=$(gh api "repos/${REPO}/pulls/${NUMBER}" --jq '.head.repo.full_name // empty')
          for status in queued waiting pending in_progress; do
            gh run list --repo "${REPO}" --workflow "${workflow_file}" --status "${status}" --limit 100 \
              --json databaseId,displayTitle \
            | jq -r --arg a "E2E ${REPO}:${branch} @ " --arg b "E2E ${head_repo}:${branch} @ " --arg current "${current}" \
                '.[] | select((.displayTitle | startswith($a)) or (.displayTitle | startswith($b))) | select(.displayTitle | endswith($current) | not) | "\(.databaseId) \(.displayTitle | split(" @ ") | last)"'
          done | while read -r id sha; do
            # A title names a repository and a branch, and two fork pull requests can share both (a branch called
            # main, say). Never cancel the run of a commit that belongs to another open pull request.
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Leaving run ${id}: no commit in its title"; continue; }
            others=$(gh api "repos/${REPO}/commits/${sha}/pulls" --jq "[.[] | select(.state == \"open\" and .number != ${NUMBER})] | length")
            if [[ "${others}" != "0" ]]; then
              echo "Leaving run ${id}: its commit belongs to another open pull request"
              continue
            fi
            echo "Cancelling run ${id}, which is for an older commit"
            gh run cancel "${id}" --repo "${REPO}" || echo "run ${id} already finished"
          done

  # The review relay only wakes the caller. Once it has, its run is of no use and its row on the pull request is noise,
  # so delete it (a deleted run takes its check rows with it). Only a relay that succeeded: a failed one stays, to be
  # looked at. The early comment run (e2e-pr-comment.yml) is deleted whatever its result: its row is a red line on the
  # pull request that no one can act on, and the decision's own early job posts the comment a few seconds later anyway.
  # A separate job, not a step of `decide`: the concurrency group of `decide` cancels a waiting run, and a cancelled run
  # would leave its relay row behind.
  clean-relay:
    name: Remove the relay run
    if: >-
      github.event.action == 'completed' &&
      ((github.event.workflow_run.name == inputs.relay-workflow-name &&
        github.event.workflow_run.conclusion == 'success') ||
       github.event.workflow_run.name == inputs.comment-workflow-name)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Delete the relay run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api -X DELETE "repos/${REPO}/actions/runs/${RUN_ID}" \
            || echo "::warning::Could not delete the finished run ${RUN_ID}"

  # The Jira reference check runs again for every label and title change, so a pull request collects one row per run. Keep
  # the newest run of the commit and delete the older finished ones (a deleted run takes its check rows with it; the
  # newest is the one that counts for the merge anyway). Done here, in the default branch's context, because a pull
  # request from a fork gets a read-only token and could not delete anything itself.
  tidy-jira-reference:
    name: Remove superseded jira-reference runs
    if: github.event.action == 'completed' && github.event.workflow_run.name == inputs.ci-workflow-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete the older runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          JIRA_PATH: ${{ inputs.jira-workflow-path }}
        run: |
          set -euo pipefail
          runs=$(gh api --paginate "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&event=pull_request&per_page=100" \
            --jq ".workflow_runs[] | select(.path == \"${JIRA_PATH}\") | [.id, .status, .created_at] | @tsv" \
            | sort -k3,3r)
          newest=$(head -n 1 <<<"${runs}" | cut -f1)
          [[ -n "${newest}" ]] || { echo "No jira-reference run for ${HEAD_SHA}"; exit 0; }
          # Everything but the newest, and only what has finished.
          tail -n +2 <<<"${runs}" | while IFS=$'\t' read -r id status _; do
            [[ "${status}" == "completed" ]] || continue
            echo "Deleting superseded jira-reference run ${id}"
            gh api -X DELETE "repos/${REPO}/actions/runs/${id}" || echo "::warning::Could not delete run ${id}"
          done

  # Turns auto-merge on for an approved pull request, so nobody has to come back to add it to the merge queue: once the
  # required checks are green GitHub puts it in the queue, and the queue merges it. It changes no rule. A new commit drops
  # the approval. "Disable auto-merge" on a pull request keeps it off: the job does nothing when auto-merge was turned off
  # after the latest approval of the head commit (so a pull request converted to a draft after its approval is not turned
  # on again by this job; turn it on by hand).
  auto-merge:
    name: Auto-merge
    needs: decide
    if: needs.decide.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The token of the OSAC CI app, not the workflow's: a pull request queued with the workflow's token starts no
      # workflow for the queue (GitHub does not run workflows for what that token causes), so it would wait for its
      # checks for ever.
      - name: Token of the OSAC CI app
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.OSAC_CI_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: write
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ needs.decide.outputs.approved-number }}
          HEAD_SHA: ${{ needs.decide.outputs.approved-sha }}
        run: |
          set -euo pipefail
          view=$(gh pr view "${NUMBER}" --repo "${REPO}" --json autoMergeRequest,isDraft)
          if [[ "$(jq -r '.autoMergeRequest != null or .isDraft' <<<"${view}")" == "true" ]]; then
            echo "PR #${NUMBER} has auto-merge already, or is a draft"
            exit 0
          fi
          approved_at=$(gh api --paginate --slurp "repos/${REPO}/pulls/${NUMBER}/reviews" \
            | jq -r --arg sha "${HEAD_SHA}" '[.[][] | select(.state == "APPROVED" and .commit_id == $sha) | .submitted_at] | max // ""')
          disabled_at=$(gh api --paginate --slurp "repos/${REPO}/issues/${NUMBER}/events" \
            | jq -r '[.[][] | select(.event == "auto_merge_disabled") | .created_at] | max // ""')
          if [[ -n "${disabled_at}" && "${disabled_at}" > "${approved_at}" ]]; then
            echo "Auto-merge was turned off on PR #${NUMBER} after its approval; leaving it off"
            exit 0
          fi
          # Only for the commit that was decided on: if the pull request has moved on, GitHub refuses.
          gh pr merge "${NUMBER}" --repo "${REPO}" --auto --match-head-commit "${HEAD_SHA}" \
            || echo "::warning::Could not enable auto-merge on PR #${NUMBER}"
