---
# Shared workflow: plans the full-install E2E for a merge queue entry. By the time a pull request is queued it was
# approved and tested on its own commit; the queue entry is that change on top of the latest main (and of the entries
# ahead of it), so it is tested again, with no approval to wait for. The caller runs the suites the plan lists, as one
# job each (a suite job per id, `if: contains(needs.plan.outputs.suites, '"<id>"')`), and then calls
# e2e-queue-finish.yml, which writes the required `E2E` check.
#
# Jobs:
#   plan          lists the suites the entry needs by the repository's policy (docs only: none);
#   cancel-stale  a queue entry is rebuilt when the entries ahead of it change; the run of the old entry is of no use
#                 any more and holds runners, so it is cancelled (only older runs of the same `pr-<N>`).
#
# The caller triggers on `merge_group` and gives the calling job contents read and actions write.
name: E2E queue plan

on:
  workflow_call:
    inputs:
      policy-file:
        description: The repository's E2E policy (suites and path filters)
        type: string
        default: .github/e2e-policy.yml
    outputs:
      suites:
        description: JSON list of the suite ids the entry needs
        value: ${{ jobs.plan.outputs.suites }}

permissions: {}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      suites: ${{ steps.suites.outputs.suites }}
    steps:
      # The queue entry itself (the merged result) with its history, to list what changed against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: List the changed files
        env:
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: git diff --name-only "${BASE}" "${HEAD}" > "${RUNNER_TEMP}/changed-files"
      # `$/` is this workflow's own repository at the exact commit the caller pinned (a plain `./` would resolve against
      # the caller's workspace).
      - uses: $/.github/actions/e2e-suites
        id: suites
        with:
          policy-file: ${{ github.workspace }}/${{ inputs.policy-file }}
          files-file: ${{ runner.temp }}/changed-files

  cancel-stale:
    name: Cancel superseded runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel superseded runs for this queue entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          THIS_RUN: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          # In a called workflow `github.workflow_ref` names the caller's file.
          workflow_file=$(basename "${WORKFLOW_REF%%@*}")
          entry="${HEAD_REF##*/}"   # pr-<N>-<sha>
          pr="${entry%-*}"          # pr-<N>
          case "$pr" in
            pr-[0-9]*) ;;
            *) echo "unexpected merge_group head_ref: '${HEAD_REF}'" >&2; exit 1 ;;
          esac
          echo "This entry: ${pr} (run ${THIS_RUN}); cancelling any older run for it."
          gh run list --workflow "${workflow_file}" --event merge_group \
            --limit 100 --json databaseId,headBranch,status \
            --jq ".[] | select(.headBranch | contains(\"/${pr}-\"))
                      | select(.status == \"in_progress\" or .status == \"queued\")
                      | select(.databaseId < ${THIS_RUN}) | .databaseId" \
          | while read -r id; do
              echo "Cancelling superseded run ${id}"
              gh run cancel "${id}" || echo "run ${id} already finished; nothing to cancel"
            done
