---
name: Show each E2E suite as a status on the pull request
description: >-
  Write a status named "E2E / <Suite>" on the pull request's head commit for each suite that is about to run, and keep it
  current (waiting for a runner, running) with a link to the suite job's logs until every job has a runner. Run it as a
  job next to the suite jobs, in the same workflow run. Called from a workflow of the repository that runs on the default
  branch, pinned to a commit of osac-ci, like the other actions.

# The calling workflow decides when this runs and what token it holds (statuses: write, actions: read). This action never
# checks out the calling repository, so it cannot run pull request code. Every input reaches the shell through an
# environment variable, never through the script text.
inputs:
  github-token:
    description: Token that can write commit statuses and read workflow runs (normally the job's built-in token)
    required: true
  repo:
    description: Repository, owner/name
    required: true
  sha:
    description: The head commit the suites run for (the sha output of e2e-report)
    required: true
  suites:
    description: Comma-separated suites that run, such as vmaas,caas (from the suites output of e2e-report)
    required: true
  run-id:
    description: The workflow run that holds the suite jobs
    default: ${{ github.run_id }}
  run-url:
    description: Link of that run, shown while a job does not exist yet
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  timeout:
    description: Seconds to wait for the jobs to get a runner
    default: "7200"

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Track
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        SHA: ${{ inputs.sha }}
        SUITES: ${{ inputs.suites }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_URL: ${{ inputs.run-url }}
        TIMEOUT: ${{ inputs.timeout }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$RUN_ID" in "" | *[!0-9]*) echo "::error::The run id must be digits only."; exit 1 ;; esac
        case "$TIMEOUT" in "" | *[!0-9]*) echo "::error::The timeout must be digits only."; exit 1 ;; esac
        uv run --locked --project "$root" osac-ci e2e-suites-track --repo "$REPO" --sha "$SHA" --run-id "$RUN_ID" \
          --run-url="$RUN_URL" --suites "$SUITES" --timeout "$TIMEOUT"
