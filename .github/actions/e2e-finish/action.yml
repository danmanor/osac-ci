---
name: Record the result of the E2E on the pull request
description: >-
  Write the pull request's E2E status with how the suites ended (success, failure or cancelled). Run it as the last job of the workflow, whatever happened before. Called from a workflow of
  the repository that runs on the default branch, pinned to a commit of osac-ci, like the other actions.

# The calling workflow decides when this runs and what token it holds (statuses: write). This action never checks out the
# calling repository, so it cannot run pull request code. Every input reaches the shell through an environment variable,
# never through the script text.
inputs:
  github-token:
    description: Token that can write commit statuses (normally the job's built-in token)
    required: true
  repo:
    description: Repository, owner/name
    required: true
  sha:
    description: The head commit the E2E ran for (the sha output of e2e-report)
    required: true
  result:
    description: success, failure or cancelled
    required: true
  detail:
    description: Text after the result in the status; empty means just the result
    default: ""
  run-url:
    description: Link of that run, shown with the status
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  kind:
    description: >-
      Where the lines are written: "statuses" (commit statuses, shown with a yellow dot) or "checks" (check runs of the
      app whose token is given, shown with a spinner; the token must be an app installation token with checks: write)
    default: statuses

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Finish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        SHA: ${{ inputs.sha }}
        RESULT: ${{ inputs.result }}
        DETAIL: ${{ inputs.detail }}
        RUN_URL: ${{ inputs.run-url }}
        KIND: ${{ inputs.kind }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$KIND" in
          statuses | checks) ;;
          *) echo "::error::The kind must be statuses or checks."; exit 1 ;;
        esac
        case "$RESULT" in
          success | failure | cancelled) ;;
          *) echo "::error::The result must be success, failure or cancelled."; exit 1 ;;
        esac
        case "$SHA" in
          "" | *[!0-9a-f]*) echo "::error::The head commit must be 40 lower-case hexadecimal digits."; exit 1 ;;
        esac
        if [ "${#SHA}" -ne 40 ]; then echo "::error::The head commit must be 40 characters."; exit 1; fi
        args=(--repo "$REPO" --sha "$SHA" --result "$RESULT" --run-url="$RUN_URL" --kind "$KIND")
        if [ -n "$DETAIL" ]; then args+=(--detail="$DETAIL"); fi
        # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
        uv run --locked --project "$root" osac-ci e2e-finish "${args[@]}" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
