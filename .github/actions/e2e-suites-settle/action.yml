---
name: Record how each E2E suite ended on the pull request
description: >-
  Complete the suite lines written by e2e-suites-track with the result of each suite job (success, failure or
  cancelled), each with a link to its job's logs. Run it as the last job of the workflow, whatever happened before. Called
  from a workflow of the repository that runs on the default branch, pinned to a commit of osac-ci, like the other
  actions.

# The calling workflow decides when this runs and what token it holds (statuses: write, actions: read). Run it in a job that
# needs the job running e2e-suites-track, so a late tracking write cannot reopen a finished suite. This action never
# checks out the calling repository, so it cannot run pull request code. Every input reaches the shell through an
# environment variable, never through the script text.
inputs:
  github-token:
    description: Token that can write commit statuses and read workflow runs (normally the job's built-in token)
    required: true
  repo:
    description: Repository, owner/name
    required: true
  sha:
    description: The head commit the suites ran for
    required: true
  suite-checks:
    description: >-
      JSON object, suite id -> line name, of the suites that ran (the same value given to e2e-suites-track); each suite's
      result is read from its job in the workflow run
    required: true
  run-id:
    description: The workflow run that holds the suite jobs
    default: ${{ github.run_id }}
  run-url:
    description: Link of that run, used when a suite has no job
    default: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  kind:
    description: >-
      Where the lines are written: "statuses" (commit statuses, shown with a yellow dot) or "checks" (check runs of the
      app whose token is given, shown with a spinner; the token must be an app installation token with checks: write)
    default: statuses

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Settle
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        SHA: ${{ inputs.sha }}
        SUITE_CHECKS: ${{ inputs.suite-checks }}
        RUN_ID: ${{ inputs.run-id }}
        RUN_URL: ${{ inputs.run-url }}
        KIND: ${{ inputs.kind }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        case "$KIND" in
          statuses | checks) ;;
          *) echo "::error::The kind must be statuses or checks."; exit 1 ;;
        esac
        case "$RUN_ID" in "" | *[!0-9]*) echo "::error::The run id must be digits only."; exit 1 ;; esac
        if [ -z "$SUITE_CHECKS" ] || [ "$SUITE_CHECKS" = "{}" ]; then echo "::notice::No suite line to settle."; exit 0; fi
        uv run --locked --project "$root" osac-ci e2e-suites-settle --repo "$REPO" --sha "$SHA" --run-id "$RUN_ID" \
          --run-url="$RUN_URL" --kind "$KIND" --suite-checks "$SUITE_CHECKS"
