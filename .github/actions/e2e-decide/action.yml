---
name: Decide whether the E2E should start
description: >-
  Say whether the full-install E2E should start for a pull request now (approved by a person with write access or
  CodeRabbit; for a pull request from a fork only a person with write access, no cheap check has already failed, the change affects an E2E suite; checks still running do not delay it) and why, as a job summary and a JSON file. It
  starts nothing: a repository runs it as a dry run next to its current flow. Called from a workflow of the
  repository, pinned to a commit of osac-ci, like the publish action.

# The calling workflow decides when this runs and what token it holds (read access to pull requests and checks is
# enough). This action never checks out the calling repository, so it cannot run pull request code. Every input
# reaches the shell through an environment variable, never through the script text.
inputs:
  github-token:
    description: Token that can read pull requests, reviews and checks (normally the job's built-in token)
    required: true
  repo:
    description: Repository to read, owner/name
    required: true
  policy:
    description: Policy file, relative to the root of osac-ci at the pinned commit
    default: policy/osac.yml
  policy-file:
    description: >-
      Policy file given as a path on the runner, used instead of policy. A repository keeps its own E2E policy next to
      its path filters and checks out the file from its default branch (never from the pull request) to pass it here
    default: ""
  number:
    description: Pull request number (exactly one). Empty means the pull request is found from head-sha
    default: ""
  head-sha:
    description: >-
      Head commit of the workflow run that finished (from a workflow_run event). The open pull request(s) with exactly
      this head are evaluated
    default: ""
  manual-comment-id:
    description: >-
      Id of the comment of an issue_comment event: when it is the control comment that was edited, the suites whose box is
      checked are started by hand; when it is a /test comment, the suites it names (or the ones the change needs). Either
      way only if the person is a member of the organization. Needs number and manual-by
    default: ""
  manual-by:
    description: Login of the person who edited the control comment or wrote the /test comment
    default: ""
  org-token:
    description: Token that can read the members of the organization (members read); used for a request by hand
    default: ""

outputs:
  json-file:
    description: Path of the JSON file with one decision per pull request (empty when none was evaluated)
    value: ${{ steps.decide.outputs.json-file }}
  ready:
    description: >-
      "true" only when exactly one pull request was evaluated and the answer is to start the E2E; "false" in every
      other case (not approved, a cheap check not green, not affected, nothing found, several pull requests with this
      head). It is a string, and the string "false" is truthy in an expression, so a consumer must compare it with
      'true' (for example needs.decide.outputs.ready == 'true') or convert it with fromJSON(); it fails closed only then
    value: ${{ steps.decide.outputs.ready }}
  reason:
    description: Why, in one line (the decision's reason; a short explanation when nothing or several were evaluated)
    value: ${{ steps.decide.outputs.reason }}
  number:
    description: Number of the pull request when exactly one was evaluated, otherwise empty
    value: ${{ steps.decide.outputs.number }}
  suites:
    description: JSON list of the E2E suites the change affects, such as ["vmaas","caas"] (empty list when not ready)
    value: ${{ steps.decide.outputs.suites }}

runs:
  using: composite
  steps:
    - name: Install uv
      shell: bash
      run: pipx install uv==0.11.21
    - name: Decide
      id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        POLICY: ${{ inputs.policy }}
        POLICY_FILE: ${{ inputs.policy-file }}
        NUMBER: ${{ inputs.number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        MANUAL_COMMENT_ID: ${{ inputs.manual-comment-id }}
        MANUAL_BY: ${{ inputs.manual-by }}
        OSAC_CI_ORG_TOKEN: ${{ inputs.org-token }}
        ACTION_PATH: ${{ github.action_path }}
        OUT_DIR: ${{ runner.temp }}
      run: |
        set -euo pipefail
        root="$ACTION_PATH/../../.."
        if [ -z "${OSAC_CI_ORG_TOKEN:-}" ]; then unset OSAC_CI_ORG_TOKEN; fi
        if [ -n "$NUMBER" ]; then
          case "$NUMBER" in
            *[!0-9]*) echo "::error::The pull request number must be digits only."; exit 1 ;;
          esac
          which=(--number "$NUMBER")
        elif [ -n "$HEAD_SHA" ]; then
          case "$HEAD_SHA" in
            *[!0-9a-f]*) echo "::error::The head commit must be 40 lower-case hexadecimal digits."; exit 1 ;;
          esac
          if [ "${#HEAD_SHA}" -ne 40 ]; then echo "::error::The head commit must be 40 characters."; exit 1; fi
          which=(--head-sha "$HEAD_SHA")
        else
          echo "::notice::Neither a pull request number nor a head commit was given; nothing to decide."
          {
            echo "json-file="
            echo "ready=false"
            echo "reason=no pull request number or head commit was given"
            echo "suites=[]"
            echo "number="
          } >> "$GITHUB_OUTPUT"
          exit 0
        fi
        json="$OUT_DIR/e2e-decision.json"
        policy_path="$root/$POLICY"
        if [ -n "$POLICY_FILE" ]; then policy_path="$POLICY_FILE"; fi
        # --project makes uv use the locked environment of osac-ci at the pinned commit, wherever the job runs.
        by_hand=()
        if [ -n "${MANUAL_COMMENT_ID:-}" ]; then
          case "$MANUAL_COMMENT_ID" in
            *[!0-9]*) echo "::error::The comment id must be digits only."; exit 1 ;;
          esac
          by_hand=(--manual-comment-id "$MANUAL_COMMENT_ID" "--manual-by=${MANUAL_BY:-}")
        fi
        uv run --locked --project "$root" osac-ci e2e-decide --policy "$policy_path" --repo "$REPO" "${which[@]}" \
          ${by_hand[@]+"${by_hand[@]}"} --json-file "$json" | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
        # The answer for a job that starts from it: ready only for exactly one pull request whose answer is "start".
        count=$(jq 'length' "$json")
        ready=false
        reason="no open pull request has this head commit"
        suites="[]"
        pr_number=""
        if [ "$count" -eq 1 ]; then
          pr_number=$(jq -r '.[0].number' "$json")
          if [ "$(jq -r '.[0].action' "$json")" = "start" ]; then
            ready=true
            suites=$(jq -c '.[0].suites' "$json")
          fi
          reason=$(jq -j '.[0].reason' "$json" | tr '\r\n' '  ')
        elif [ "$count" -gt 1 ]; then
          reason="$count pull requests have this head commit; read the JSON file"
        fi
        {
          echo "json-file=$json"
          echo "ready=$ready"
          echo "reason=$reason"
          echo "suites=$suites"
          echo "number=$pr_number"
        } >> "$GITHUB_OUTPUT"
